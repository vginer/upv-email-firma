<title>Firma de correo UPV (version azul, sin foto, 360 px) - Vicent Giner Bosch</title>
</head>

<!--
  ============================================================================
  FIRMA DE CORREO UPV - version azul, sin foto, 360 px
  Vicent Giner Bosch (vigibos@eio.upv.es) - v1, agosto de 2026

  Esta es MI firma, no una plantilla generica: lleva mis datos. Se comparte
  porque las plantillas que distribuye la UPV estan hechas para el Outlook
  clasico y se descomponen al pegarlas en el editor de firmas del nuevo
  Outlook. Este archivo esta reconstruido para sobrevivir a ese editor y a
  los saneadores de HTML de Gmail, Yahoo y los clientes de iOS.

  Instrucciones de adaptacion y de montaje: README.md
  Los puntos que hay que tocar para reutilizarla van marcados con [CAMBIAR].

  Referencias oficiales de la UPV:
    - Modelos de firma (documento normativo, PDF):
      https://www.upv.es/comu/nueva-imagen/recursos/ANEXO_modelos_firmas_correo-UPV.pdf
    - Plantillas y ayuda del CAU (pensadas para el Outlook clasico):
      https://wiki.upv.es/confluence/spaces/FAQCAU/pages/598442013/Correo+Identidad+Visual
    - Gestion de marca e identidad visual corporativa:
      https://www.upv.es/entidades/acom/gestion-marca-identidad-visual-corporativa-2/

  El grafo de la UPV y el logotipo del DEIOAC son marcas de sus titulares y se
  usan aqui conforme a la identidad visual corporativa de la UPV.
  ============================================================================
-->

<!--
  ============================================================================
  NOTAS TECNICAS
  Basada en ANEXO_modelos_firmas_correo-UPV.pdf: "FIRMA BASE SIN FOTO (360px)"
  + "PLANTILLA BASE - PERSONAL DE ESCUELAS Y FACULTADES" (logo departamental).

  MEDIDAS TOMADAS DEL PDF OFICIAL (el PDF esta a escala 1:1 en px):
    - Ancho total ............................. 360 px
    - Bloque derecho (logos) .................. 140 px, pegado al borde derecho
    - Logo departamental ...................... max. 140 x 50 px
    - Grafo UPV ............................... 140 x 49 px
    - Iconos RS ............................... alto fijo 13 px, max. 5 iconos
    - Hueco linea de color -> contenido ....... 20 px
    - Columna derecha: logo dpto. |15,4 px| iconos |26,7 px| grafo UPV
      (aqui se usa 15 y 25). El segundo hueco es FIJO: 25-30 px en todos los
      modelos medidos. El primero es el que absorbe el sobrante y va de 15,4 px
      (logotipo de 50 px de alto) a 43,4 px (logotipo de 19,6 px).
    - Columna izquierda: los 4 bloques de texto van separados SIEMPRE por la
      misma distancia; solo el correo y el telefono van mas juntos (~5 px).

  JERARQUIA TIPOGRAFICA DEL PDF OFICIAL (fuente / cuerpo / color medidos):
    - correo y direccion web ... Helvetica Regular  12 px    #333333
    - Tel. / Ext. .............. Helvetica Light    11 px    #666666
    - escuela / departamento ... Helvetica Light    10 px    #4D4D4D
    - edificio ................. Helvetica Light    12 px    #666666
    - Universitat Politecnica .. Helvetica Regular  11,14 px #29282B
    El "destacado" del oficial NO es negrita: es Regular frente a Light, con
    color mas oscuro. Como Windows/Outlook no tiene Arial Light (Helvetica se
    sustituye por Arial), aqui el contraste se reproduce con el color:
    destacados en #333333 / #29282B y secundarios en #666666 / #4D4D4D.
    - En el PDF, el texto de la izquierda se alinea por ARRIBA con el logo
      departamental y por ABAJO con la base del grafo UPV. El lado mas alto
      manda; el otro reparte el sobrante entre sus huecos.

  ARITMETICA DE ESTA FIRMA (en px; 1 px = 0,75 pt):
    DERECHA (fija, la marcan las imagenes):
      50 (logo) + 15 (hueco1) + 13 (iconos) + 25 (hueco2) + 49 (grafo) = 152 px
    IZQUIERDA (suma de alturas de fila):
      14 (web) + 5 (hueco corto) + 14 (Tel) + 14 (Ext)
      + 42 (dpto., 3 lineas x 14) + 18 (edificio, icono 15 px) + 26 (UPV, 2x13)
      = 133 px  +  3 huecos G
      Alto VISUAL = 133 + 3G - 5,14   (se descuentan 2,57 px arriba y abajo:
      es el espacio muerto entre el borde de la linea de texto y la altura de
      mayuscula / la linea base, con line-height 14 px sobre fuente de 12 px)
    IGUALANDO alto visual izquierdo = 152  ->  G = 8,05  ->  G = 8 px (6 pt)
      Resultado: izquierda 151,86 px visuales / derecha 152 px (desvio 0,14 px)
    DESFASE SUPERIOR: la caja de texto empieza 2,57 px por encima de la altura
      de mayuscula, asi que la celda derecha lleva padding-top de 2,5 px
      (1,875 pt) para que el logo del DEIOAC arranque a la misma altura visual.

  SI CAMBIA EL CONTENIDO:
    - Si crece/mengua la IZQUIERDA (mas o menos lineas), recalcular
      G = (152 - suma_alturas_izquierda + 5,14) / n_huecos, con G >= 5 px.
    - Si la IZQUIERDA pasara a ser mas alta, NO tocar el hueco iconos->grafo:
      medido sobre el PDF, en todos los modelos con logotipo se mantiene entre
      25 y 30 px. El sobrante va INTEGRO al hueco logotipo->iconos, que en la
      norma va de 15,4 px (logotipo de 50 px) a 43,4 px (logotipo de 19,6 px).
      Es decir: logotipo pegado arriba, grafo pegado abajo, iconos a unos 27 px
      del grafo, y el aire sobrante entre logotipo e iconos:
      hueco1 = alto_visual_izquierdo - alto_logotipo - 13 - 27 - 49.
    - Las alturas van como height en <tr>/<td>: Word/Outlook las trata como
      minimos, de modo que si algo no cupiera la fila crece (no se recorta).

  IMAGENES (tamano final, sin reescalar; insertar en Outlook a tamano natural):
      deioac_gris.png ... 50 x 50 px    gris #808080 (se ve tambien
                                       sobre fondo oscuro)
      linkedin.png ...... 13 x 13 px    gris #808080
      mastodon.png ...... 12 x 13 px    gris #808080
      github.png ........ 13 x 13 px    gris #808080
      pin_map_AZ.png .....  9 x 15 px   cian UPV #59CBE8
      upv_grafo_AZ.png .. 140 x 49 px   cian UPV
    VERSION AMARILLA: basta sustituir en este archivo pin_map_AZ.png por
    pin_map_AM.png, upv_grafo_AZ.png por upv_grafo_AM.png y las dos apariciones
    de #59CBE8 (fila de color, primera fila del cuerpo) por #FFD100.
  ULTIMO CAMBIO: 19 de agosto de 2026 (v1.1)
    - Corregida la regla documentada para cuando la columna izquierda es la
      mas alta: el hueco iconos->grafo es fijo y el sobrante va al hueco
      logotipo->iconos (ver "SI CAMBIA EL CONTENIDO").
    - Retirado el margin-left:7.1pt de las dos tablas, heredado de la plantilla
      oficial (era una compensacion del exportador de Word para el relleno de
      las celdas). Sin el, la firma queda a ras del margen del texto del
      mensaje; antes se desplazaba 9 px a la derecha. No afecta a ninguna
      medida interna: anchos, huecos y alineaciones se calculan dentro de la
      tabla.

  ============================================================================
-->
